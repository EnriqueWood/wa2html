name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.13"]
        include:
          # Oldest supported version (see requires-python in pyproject.toml).
          - os: ubuntu-latest
            python: "3.10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Virtual display for the window tests (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run the test suite
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          display=""
          if [ "$RUNNER_OS" = "Linux" ]; then display="xvfb-run -a"; fi
          $display python -m unittest discover -s tests -t . -v 2>&1 | tee test-output.txt
      - name: Show the end of the test output as an annotation
        if: failure()
        shell: bash
        run: python .github/scripts/annotate_tail.py test-output.txt
