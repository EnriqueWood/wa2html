# Builds the downloadable programs and publishes them as a GitHub release when a
# version tag (v1.2.3) is pushed:
#   Windows  wa2html-windows-x64.exe (window) and wa2html-cli-windows-x64.exe (terminal)
#   macOS    wa2html-macos-arm64.dmg (wa2html.app)
#   Linux    wa2html-linux-x64.AppImage, .deb, .rpm and the bare wa2html-linux-x64 program
# Every file is smoke-tested before the release: conversions in both modes and the
# window driven by --gui-selftest; the .deb and .rpm are installed in clean
# containers of several distributions, and the .dmg is mounted and its app tested.
# A push that changes the packaging (on any branch), or running it by hand (Actions
# tab -> Release -> Run workflow), only builds and tests; the files are kept as
# workflow artifacts.
name: Release

on:
  push:
    tags: ["v*"]
    # Path filters do not apply to tags: every version tag builds and releases.
    branches: ["**"]
    paths: ["packaging/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  PYINSTALLER_VERSION: "6.22.3"

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  version:
    name: Check the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: The tag must match the package version
        run: |
          version=$(python -c "import wa2html; print(wa2html.__version__)")
          echo "wa2html $version"
          if [[ "$GITHUB_REF" == refs/tags/v* && "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match wa2html.__version__ $version"
            exit 1
          fi

  windows:
    name: Build ${{ matrix.asset }}
    needs: [tests, version]
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The window-only program most people want (no console at all)...
          - asset: wa2html-windows-x64.exe
            entry: packaging/wa2html_gui.py
            pyinstaller_args: --windowed
            smoke_args: --gui-only
          # ...and the command-line program, for terminals and scripts.
          - asset: wa2html-cli-windows-x64.exe
            entry: packaging/wa2html_cli_windows.py
            pyinstaller_args: ""
            smoke_args: ""
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install wa2html and PyInstaller
        run: python -m pip install . "pyinstaller==$PYINSTALLER_VERSION"
      - name: Check that Tk (for the window) is available
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"
      - name: Icon
        run: python packaging/make_icon.py build/wa2html.ico
      - name: Build
        run: >
          pyinstaller --onefile --name wa2html --collect-data wa2html --icon build/wa2html.ico
          ${{ matrix.pyinstaller_args }} --noconfirm --clean ${{ matrix.entry }}
      - name: Smoke test
        run: python packaging/smoke_test.py dist/wa2html.exe ${{ matrix.smoke_args }}
      - name: Rename
        run: mkdir -p dist/release && mv dist/wa2html.exe "dist/release/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/release/${{ matrix.asset }}
          if-no-files-found: error

  macos:
    name: Build wa2html-macos-arm64.dmg
    needs: [tests, version]
    # Apple silicon. Intel Macs can run wa2html with Python (see README).
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install wa2html and PyInstaller
        run: python -m pip install . "pyinstaller==$PYINSTALLER_VERSION"
      - name: Check that Tk (for the window) is available
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"
      - name: Icon
        run: python packaging/macos_app.py icon build/wa2html.icns
      # One program: opened from Finder it shows the window; from a terminal,
      # wa2html.app/Contents/MacOS/wa2html works as the command line.
      - name: Build wa2html.app
        run: >
          pyinstaller --onedir --windowed --name wa2html --collect-data wa2html
          --icon build/wa2html.icns --osx-bundle-identifier io.github.enriquewood.wa2html
          --noconfirm --clean packaging/wa2html_cli.py
      - name: Smoke test the app
        run: python packaging/smoke_test.py dist/wa2html.app/Contents/MacOS/wa2html
      - name: Disk image
        run: python packaging/macos_app.py dmg dist/wa2html.app dist/release/wa2html-macos-arm64.dmg
      - name: Test the app inside the disk image
        run: python packaging/macos_app.py check-dmg dist/release/wa2html-macos-arm64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: wa2html-macos-arm64.dmg
          path: dist/release/wa2html-macos-arm64.dmg
          if-no-files-found: error

  linux:
    name: Build Linux (AppImage, .deb, .rpm, program)
    needs: [tests, version]
    # An older Ubuntu keeps the programs compatible with older distributions (glibc).
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      # Pinned releases of the AppImage tools, checked by SHA-256 (the digests GitHub
      # shows for these release files).
      APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
      APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
      APPIMAGE_RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
      APPIMAGE_RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install wa2html and PyInstaller
        run: python -m pip install . "pyinstaller==$PYINSTALLER_VERSION"
      - name: Check that Tk (for the window) is available
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"
      - name: Packaging tools and a virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb rpm desktop-file-utils

      # packaging/linux.spec leaves the font libraries to the system (see the comment there).
      - name: Build the single-file program
        run: >
          WA2HTML_ONEFILE=1 pyinstaller --distpath dist/onefile --workpath build/onefile
          --noconfirm --clean packaging/linux.spec
      - name: Build the one-folder program (for the packages)
        run: >
          pyinstaller --distpath dist/onedir --workpath build/onedir
          --noconfirm --clean packaging/linux.spec
      - name: Smoke test both
        run: |
          xvfb-run -a python packaging/smoke_test.py dist/onefile/wa2html
          xvfb-run -a python packaging/smoke_test.py dist/onedir/wa2html/wa2html

      - name: Download the AppImage tools
        run: |
          curl -fsSL -o build/appimagetool "$APPIMAGETOOL_URL"
          curl -fsSL -o build/runtime-x86_64 "$APPIMAGE_RUNTIME_URL"
          echo "$APPIMAGETOOL_SHA256  build/appimagetool" | sha256sum -c
          echo "$APPIMAGE_RUNTIME_SHA256  build/runtime-x86_64" | sha256sum -c
          chmod +x build/appimagetool
      - name: Check the menu entry
        run: desktop-file-validate packaging/linux/wa2html.desktop
      - name: Build the AppImage, .deb and .rpm
        run: >
          python packaging/linux_packages.py dist/onedir/wa2html dist/release
          --appimagetool build/appimagetool --runtime build/runtime-x86_64
      - name: Add the single-file program
        run: mv dist/onefile/wa2html dist/release/wa2html-linux-x64

      - name: Test the AppImage
        run: |
          ls -l /dev/fuse || true
          if command -v fusermount3 >/dev/null || command -v fusermount >/dev/null; then
            xvfb-run -a python packaging/smoke_test.py dist/release/wa2html-linux-x64.AppImage
          else
            echo "::warning::no FUSE on this runner; testing the AppImage with APPIMAGE_EXTRACT_AND_RUN"
            APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a python packaging/smoke_test.py dist/release/wa2html-linux-x64.AppImage
          fi
      - name: Test the .deb on Ubuntu 22.04
        run: docker run --rm -v "$PWD:/w" -w /w ubuntu:22.04 sh packaging/test_linux_package.sh dist/release/wa2html-linux-x64.deb
      - name: Test the .deb on Debian (stable)
        run: docker run --rm -v "$PWD:/w" -w /w debian:stable sh packaging/test_linux_package.sh dist/release/wa2html-linux-x64.deb
      - name: Test the .rpm on Fedora (latest)
        run: docker run --rm -v "$PWD:/w" -w /w fedora:latest sh packaging/test_linux_package.sh dist/release/wa2html-linux-x64.rpm
      - name: Test the .rpm on openSUSE Tumbleweed
        run: docker run --rm -v "$PWD:/w" -w /w opensuse/tumbleweed sh packaging/test_linux_package.sh dist/release/wa2html-linux-x64.rpm

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/release/
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          ls -l
          sha256sum wa2html-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "wa2html $GITHUB_REF_NAME"
          --generate-notes
