[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wa2html"
version = "0.1.0"
description = "Turn a WhatsApp chat export (.zip) into one self-contained, WhatsApp-style HTML file with playable voice notes, stickers, photos and videos."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []
keywords = ["whatsapp", "chat", "export", "archive", "html", "viewer"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Chat",
    "Topic :: System :: Archiving",
]

[project.scripts]
wa2html = "wa2html.cli:main"

[tool.setuptools]
packages = ["wa2html"]

[tool.setuptools.package-data]
wa2html = ["assets/*", "assets/vendor/*"]
